<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main>
        <header align="center">
            <h1>REGISTRATION FORM</h1>
        </header>
    
        <form id="form">
            <table align="center" border="0" height="300" width="500">

                <tr>
                    <td><label for="name"> Name </label></td>
                    <td> : </td>
                    <td><input type="text" id="name" placeholder="Enter Your Name">
                        <span id="nameError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="DOB"> DOB </label></td>
                    <td> : </td>
                    <td><input type="date" id="dob" placeholder="Enter Your DOB">
                        <span id="dobError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="gender"> Gender </label></td>
                    <td> : </td>
                    <td><input type="radio" id="male" name="gender" value="Male"><label for="male"> Male </label><input
                            type="radio" name="gender" id="female" value="Female"><label for="female">Female</label>
                        <span id="genderError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="course"> Course </label></td>
                    <td> : </td>
                    <td>
                        <select name="course" id="course">
                            <option value="">Select Course</option>
                            <option value="Btech">BTech</option>
                            <option value="Mtech">MTech</option>
                            <option value="MBA">MBA</option>
                            <option value="MCA">MCA</option>
                            <option value="BBA">BBA</option>
                            <option value="BCA">BCA</option>
                        </select>
                        <span id="courseError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="mobile">Mobile No.</label></td>
                    <td>:</td>
                    <td><input type="tel" id="mobile" maxlength="10" placeholder="Enter Mobile No.">
                        <span id="mobileError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" placeholder="Enter Email Id">
                        <span id="emailError"></span>
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Address</label></td>
                    <td>:</td>
                    <td>
                        <textarea name="add" id="address" placeholder="Enter Your Address"></textarea>
                        <span id="addressError"></span>
                    </td>
                </tr>

                <tr align="center">
                    <td colspan="4">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </td>
                </tr>



            </table>
            

            <div id="result" ></div>
        </form>
        
    </main>



    <script src="script.js"></script>
</body>

</html>
